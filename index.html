
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1264e8">
  <title>VK CONNECT</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header">
  <h2>💬 VK CONNECT</h2>
  <button id="signout" class="hidden">Sign out</button>
</header>

<main>

  <!-- LOGIN AND REGISTRATION -->
  <section id="auth-view">
    <div class="auth-box">
      <h1>Welcome to VK CONNECT</h1>
      <p>Connect with friends and family.</p>

      <div class="auth-tabs">
        <button type="button" id="login-tab">Login</button>
        <button type="button" id="signup-tab">Sign Up</button>
      </div>

      <form id="auth-form">
        <input id="display-name" type="text"
          placeholder="Your display name" class="hidden">

        <input id="email" type="email"
          placeholder="Email address" required>

        <input id="password" type="password"
          placeholder="Password" required>

        <button id="auth-submit" type="submit">Login</button>
      </form>

      <p id="auth-message"></p>
    </div>
  </section>

  <!-- MAIN APPLICATION -->
  <section id="main-view" class="hidden">

    <h2 id="welcome">Welcome to VK CONNECT</h2>

    <nav class="main-nav">
      <button data-section="chats">Chats</button>
      <button data-section="status">Status</button>
      <button data-section="calls">Calls</button>
      <button data-section="communities">Communities</button>
      <button data-section="discover">Discover</button>
      <button data-section="profile">Profile</button>
    </nav>

    <!-- CHATS -->
    <section id="section-chats">
      <h2>Chats</h2>

      <div id="people-list"></div>

      <h3 id="chat-title">Select someone to chat with</h3>

      <div id="messages"></div>

      <form id="message-form">
        <input id="message-input"
          type="text" placeholder="Write a message...">

        <button type="submit">Send</button>
      </form>

      <div class="media-upload">
        <input id="media-file" type="file"
          accept="image/*,video/*">

        <button id="upload-btn" type="button">
          Upload media
        </button>
      </div>
    </section>

    <!-- STATUS -->
    <section id="section-status" class="hidden">
      <h2>Status Updates</h2>

      <form id="status-form">
        <input id="status-input"
          type="text" placeholder="What's on your mind?">

        <button type="submit">Post Status</button>
      </form>

      <div id="status-list"></div>
    </section>

    <!-- CALLS -->
    <section id="section-calls" class="hidden">
      <h2>Calls</h2>
      <div id="calls-list"></div>
    </section>

    <!-- COMMUNITIES -->
    <section id="section-communities" class="hidden">
      <h2>Communities</h2>

      <form id="community-form">
        <input id="community-name"
          type="text" placeholder="Community name" required>

        <button type="submit">Create Community</button>
      </form>

      <div id="community-list"></div>
    </section>

    <!-- DISCOVER -->
    <section id="section-discover" class="hidden">
      <h2>Discover People</h2>
      <div id="discover-list"></div>
    </section>

    <!-- PROFILE -->
    <section id="section-profile" class="hidden">
      <h2>My Profile</h2>

      <form id="profile-form">
        <input id="profile-name"
          type="text" placeholder="Display name">

        <textarea id="profile-bio"
          placeholder="Tell people about yourself"></textarea>

        <select id="language">
          <option value="en">English</option>
          <option value="ha">Hausa</option>
          <option value="ar">Arabic</option>
          <option value="fr">French</option>
          <option value="yo">Yoruba</option>
          <option value="ig">Igbo</option>
        </select>

        <button type="submit">Save Profile</button>
      </form>

      <p id="profile-message"></p>
    </section>

  </section>
</main>

<script src="app.js"></script>
</body>
</html>
